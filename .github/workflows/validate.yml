name: Validate catalogue
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python build_catalog.py
      - run: python prepare_site.py
      - run: python validate_export.py
      - run: node --check site/app.js && node --check site/linked-ui.js && node --check site/timeseries.js && node --check site/ts-core.js
