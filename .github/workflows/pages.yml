name: Publish to GitHub Pages (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python build_catalog.py
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Prepare project or root site
        env:
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python prepare_site.py --origin "$PAGES_ORIGIN" --base-path "$PAGES_BASE_PATH"
      - name: Check prepared JavaScript
        run: |
          for script in site/*.js site/vendor/*.js; do
            node --check "$script"
          done
      - run: python validate_export.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
